[project]
name = "e2d-core"
version = "0.1.0"
description = "Explain-then-Detect core: explanations, features, scoring, ledger"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2d_core"]
