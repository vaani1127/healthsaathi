[project]
name = "e2d-core"
version = "0.1.0"
description = "Explain-then-Detect core: explanations, features, scoring, ledger"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "polars>=2.0.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.35",
    "tzdata>=2026.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2d_core"]
