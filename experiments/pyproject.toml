[project]
name = "e2d-experiments"
version = "0.1.0"
description = "Experiment runners, statistics and table export for the E2D paper"
requires-python = ">=3.12,<3.13"
dependencies = [
    "e2d-core",
    "hydra-core>=1.3.7",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "numpy>=2.5.3",
    "polars>=2.0.0",
    "saathibench",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2d_experiments"]

[tool.uv.sources]
saathibench = { workspace = true }
