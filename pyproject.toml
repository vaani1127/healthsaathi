[project]
name = "healthsaathi"
version = "0.1.0"
description = "HealthSaathi monorepo (Python workspace root)"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/e2d-core", "sim", "experiments"]

[tool.uv.sources]
e2d-core = { workspace = true }
healthsaathi-api = { workspace = true }
saathibench = { workspace = true }
e2d-experiments = { workspace = true }

[dependency-groups]
dev = [
    "healthsaathi-api",
    "e2d-core",
    "saathibench",
    "e2d-experiments",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0.12.20260906",
    "httpx-ws>=0.9.0",
    "import-linter>=2.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/api/migrations/versions", "contracts/lib", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "e2d_core", "saathibench", "e2d_experiments"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311", "S608"]
# The simulator needs seeded, reproducible randomness, not cryptographic randomness.
"sim/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/e2d-core/src", "apps/api", "sim/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "opentimestamps.*", "sklearn.*", "pyod.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = [
    "packages/e2d-core/tests",
    "apps/api/tests",
    "sim/tests",
    "experiments/tests",
]
addopts = "--import-mode=importlib"
pythonpath = ["apps/api"]

# Architecture rules, checked by `lint-imports` in `make lint`.
[tool.importlinter]
root_packages = ["e2d_core", "saathibench", "e2d_experiments", "app"]

[[tool.importlinter.contracts]]
name = "e2d-core is the shared core and depends on nothing else here"
type = "forbidden"
source_modules = ["e2d_core"]
forbidden_modules = ["app", "saathibench", "e2d_experiments"]

[[tool.importlinter.contracts]]
name = "The product never imports the simulator or the experiments"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["saathibench", "e2d_experiments"]

[[tool.importlinter.contracts]]
name = "Only evaluation code reads simulator labels"
type = "forbidden"
source_modules = [
    "e2d_core",
    "app",
    "saathibench.clinic",
    "saathibench.attacks",
    "saathibench.recorder",
    "saathibench.coverage",
]
forbidden_modules = ["saathibench.labels"]

