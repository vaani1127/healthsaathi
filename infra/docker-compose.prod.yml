# Prod-demo on one Azure VM (SPEC 3). The database is Azure PostgreSQL Flexible Server, so there is
# no postgres service here. Deployed by infra/deploy/deploy.sh; settings come from /opt/healthsaathi/.env.
name: healthsaathi

x-api: &api
  image: healthsaathi-api:${HS_TAG:?set HS_TAG}
  env_file: /opt/healthsaathi/.env
  environment:
    APP_ENV: prod
    # Only Caddy's fixed address (see networks below) may set the client IP with
    # X-Forwarded-For. Other containers on the network, and any client, cannot.
    TRUSTED_PROXY_IPS: 10.250.0.2
    # Read only by uvicorn's own proxy handling, which the current image turns off
    # (--no-proxy-headers). Kept, set to Caddy's address only, so that rolling back to an older
    # image (which reads it) still sees the real client IP.
    FORWARDED_ALLOW_IPS: 10.250.0.2
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  api:
    <<: *api
    expose:
      - "8000"

  worker:
    <<: *api
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: prod
      # Fitted detection models live on a volume so they survive deploys.
      MODEL_DIR: /var/lib/healthsaathi/models
      # A statement on a dropped connection fails after 2 minutes instead of hanging the anchor
      # timer (it did from 5 to 10 November 2026).
      DB_COMMAND_TIMEOUT_SECONDS: "120"
    volumes:
      - models:/var/lib/healthsaathi/models
    healthcheck:
      disable: true

  # One-shot: deploy.sh runs it before starting the new api and worker.
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    profiles: ["migrate"]

  # Hosted demo only: synthetic clinic activity through the API (app/scripts/demo_activity.py).
  # deploy.sh starts it when /opt/healthsaathi/activity.json exists (make prod-activity).
  activity:
    <<: *api
    command: ["python", "-m", "app.scripts.demo_activity", "/run/activity.json"]
    volumes:
      - ./activity.json:/run/activity.json:ro
    depends_on:
      - api
    healthcheck:
      disable: true
    profiles: ["activity"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Only the domain; Caddy does not get the app's secrets. Compose reads it from the .env file
    # next to this compose file.
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in /opt/healthsaathi/.env}
    networks:
      default:
        # The api trusts X-Forwarded-For from this address only (TRUSTED_PROXY_IPS).
        ipv4_address: 10.250.0.2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# A fixed subnet so Caddy can have a fixed address. Other containers get addresses from
# ip_range (10.250.0.128 and up), so none can take Caddy's. The new name makes compose create a
# new network instead of changing the old one (docs/RUNBOOK.md, "Fixed network").
networks:
  default:
    name: healthsaathi_edge
    ipam:
      config:
        - subnet: 10.250.0.0/24
          ip_range: 10.250.0.128/25
          gateway: 10.250.0.1

volumes:
  caddy_data:
  caddy_config:
  models:
