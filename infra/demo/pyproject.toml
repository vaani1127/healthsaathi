[project]
name = "healthsaathi-demo"
version = "0.1.0"
description = "Local demo stack for HealthSaathi: loads a SaathiBench run into the product database"
requires-python = ">=3.12,<3.13"
dependencies = [
    "healthsaathi-api",
    "saathibench",
    "polars>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hs_demo"]
