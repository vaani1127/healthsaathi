name: deploy

# Staging: after CI passes on main. Render free web service + Neon free database, and a Cloudflare
# Pages preview of the web app.
# Prod-demo: on a v* tag whose commit passed CI. API image to the Azure VM over SSH, and the
# Cloudflare Pages production build. See docs/RUNBOOK.md.
# Every step that needs an account is skipped while its secrets are not set.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'prod' || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  staging:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: staging
    env:
      MIGRATOR_DATABASE_URL: ${{ secrets.STAGING_MIGRATOR_DATABASE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@v6
        if: env.MIGRATOR_DATABASE_URL != ''
      - name: migrate the staging database
        if: env.MIGRATOR_DATABASE_URL != ''
        working-directory: apps/api
        env:
          APP_ENV: staging
        run: |
          uv sync --frozen --no-dev --package healthsaathi-api --python 3.12
          uv run --no-sync alembic upgrade head
      - name: deploy the API on Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null
      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
      - name: build the web app
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          VITE_API_URL: ${{ vars.STAGING_API_URL }}
          VITE_CHAIN_RPC_URL: ${{ vars.VITE_CHAIN_RPC_URL }}
          VITE_AUDIT_ANCHOR_ADDRESS: ${{ vars.VITE_AUDIT_ANCHOR_ADDRESS }}
          VITE_CLINIC_REGISTRY_ADDRESS: ${{ vars.VITE_CLINIC_REGISTRY_ADDRESS }}
          VITE_EXPLORER_URL: ${{ vars.VITE_EXPLORER_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @healthsaathi/web build
      - name: publish a Pages preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/web
        run: >
          pnpm dlx wrangler@4 pages deploy dist
          --project-name "${{ vars.CF_PAGES_PROJECT }}" --branch staging --commit-dirty=true

  prod:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: production
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: check the tagged commit is on main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          result=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$result" -lt 1 ]; then
            echo "CI has not passed for $GITHUB_SHA" >&2
            exit 1
          fi

      - name: build the API image
        if: env.VM_HOST != ''
        run: |
          docker build -f infra/api.Dockerfile --target prod -t "healthsaathi-api:$TAG" .
          docker save "healthsaathi-api:$TAG" | gzip >"healthsaathi-api-$TAG.tar.gz"
      - name: set up SSH
        if: env.VM_HOST != ''
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
      - name: deploy to the VM
        if: env.VM_HOST != ''
        env:
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          target="$VM_USER@$VM_HOST"
          scp -q "healthsaathi-api-$TAG.tar.gz" "$target:/tmp/"
          scp -q infra/docker-compose.prod.yml infra/Caddyfile infra/deploy/deploy.sh \
            infra/deploy/backup.sh "$target:/opt/healthsaathi/"
          ssh "$target" "sh /opt/healthsaathi/deploy.sh '$TAG' '/tmp/healthsaathi-api-$TAG.tar.gz'"

      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
      - name: build the web app
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          VITE_API_URL: ${{ vars.PROD_API_URL }}
          VITE_CHAIN_RPC_URL: ${{ vars.VITE_CHAIN_RPC_URL }}
          VITE_AUDIT_ANCHOR_ADDRESS: ${{ vars.VITE_AUDIT_ANCHOR_ADDRESS }}
          VITE_CLINIC_REGISTRY_ADDRESS: ${{ vars.VITE_CLINIC_REGISTRY_ADDRESS }}
          VITE_EXPLORER_URL: ${{ vars.VITE_EXPLORER_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @healthsaathi/web build
      - name: publish Pages production
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/web
        run: >
          pnpm dlx wrangler@4 pages deploy dist
          --project-name "${{ vars.CF_PAGES_PROJECT }}" --branch main --commit-dirty=true
