name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthsaathi
          POSTGRES_PASSWORD: healthsaathi
          POSTGRES_DB: healthsaathi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthsaathi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://healthsaathi:healthsaathi@localhost:5432/healthsaathi
      SKIP_DB_UP: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The anchoring tests deploy the contracts to a throwaway anvil chain.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: forge build
        working-directory: contracts
        run: forge build
      - run: uv sync --frozen --python 3.12
      - name: ruff
        run: make lint-py
      - name: pytest
        run: make test-py
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --no-emit-workspace --no-hashes -o requirements-audit.txt
          uv run pip-audit --strict -r requirements-audit.txt

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm -r lint
      - name: tsc
        run: pnpm -r typecheck
      - name: vitest
        run: pnpm -r test
      - name: build
        run: pnpm --filter @healthsaathi/web build
      - name: pnpm audit
        run: pnpm audit --prod

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthsaathi
          POSTGRES_PASSWORD: healthsaathi
          POSTGRES_DB: healthsaathi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthsaathi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://healthsaathi:healthsaathi@localhost:5432/healthsaathi
      MIGRATOR_DATABASE_URL: postgresql+asyncpg://healthsaathi:healthsaathi@localhost:5432/healthsaathi
    steps:
      - uses: actions/checkout@v5
      - name: Throwaway secrets for this run
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "OTP_HMAC_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "LEDGER_SIGNING_SEED=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "DATA_KEYS=ci:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Migrate
        working-directory: apps/api
        run: uv run alembic upgrade head
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @healthsaathi/web exec playwright install --with-deps chromium
      - name: Flows 1 to 3
        run: pnpm --filter @healthsaathi/web e2e
      - name: Installable PWA
        run: pnpm --filter @healthsaathi/web e2e:pwa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  contracts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned so local and CI builds use the same compiler pipeline and gas numbers.
          version: v1.8.5
      - name: forge fmt
        run: forge fmt --check
      - name: forge build
        run: forge build --sizes
      - name: forge test
        run: forge test -vvv
      - name: gas snapshot
        run: forge snapshot --check --no-match-test testFuzz

  slither:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          fail-on: low
