[project]
name = "healthsaathi-api"
version = "0.1.0"
description = "HealthSaathi API (FastAPI modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "e2d-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
