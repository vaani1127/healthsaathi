[project]
name = "saathibench"
version = "0.1.0"
description = "SaathiBench: synthetic OPD clinic workflow and access simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "e2d-core",
    "numpy>=2.5.3",
    "polars>=2.0.0",
    "pyyaml>=6.0.3",
    "simpy>=4.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saathibench"]
