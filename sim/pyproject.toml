[project]
name = "saathibench"
version = "0.1.0"
description = "SaathiBench: synthetic OPD clinic workflow and access simulator"
requires-python = ">=3.12,<3.13"
dependencies = ["e2d-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saathibench"]
