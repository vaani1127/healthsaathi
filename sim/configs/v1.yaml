# SaathiBench v1: 30 clinics x 180 days (SPEC 7).
name: saathibench-v1
seed: 20261008
start_date: "2026-01-05"
days: 180
timezone: Asia/Kolkata
clinics:
  - {profile: solo_gp, count: 15}
  - {profile: polyclinic, count: 10}
  - {profile: nursing_home, count: 5}
# Insider attack campaigns (types 1 to 10, SPEC 7). Mimicry is drawn uniformly from [0, 1].
attacks:
  campaigns_per_clinic_month: 2.0
  first_day: 14
  mimicry: uniform
  # Share of snooping accesses (types 1, 2 and 6, where the target is not one specific person)
  # moved to a patient with an unrelated appointment that day. Author chosen; see
  # experiments/PREREGISTRATION.md section 1.
  incidental_share: 0.0

# Generator settings that decide how hard the explanation layer's job is. Author chosen and
# frozen by the pre-registration. Null keeps each clinic profile's own value.
realism:
  hard_negative_scale: 1.0
  no_show_rate: null
  cancel_rate: null
  cover_days_per_month: null
