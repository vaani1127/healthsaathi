[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1024
# Fixed seed so the committed gas snapshot is reproducible.
seed = "0x4853"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
amoy = "${AMOY_RPC_URL}"
custom = "${CUSTOM_RPC_URL}"
